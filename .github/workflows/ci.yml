name: CI Pipeline

on:
  push:
    branches: [ main, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp_test_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit
          pip install -r requirements.txt

      - name: Code Linting (Ruff)
        run: |
          ruff check management_system

      - name: Security Check
        working-directory: ./management_system
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: test-secret-key-for-ci-checks-only
        run: |
          python manage.py check --deploy

      - name: Check Migrations
        working-directory: ./management_system
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: test-secret-key-for-ci-checks-only
        run: |
          python manage.py makemigrations --check

      - name: Run Test Suite
        working-directory: ./management_system
        env:
          DATABASE_URL: postgres://erp_user:erp_password@localhost:5432/erp_test_db
          SECRET_KEY: test-secret-key-for-ci-checks-only
        run: |
          python manage.py test
