services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zentral
      POSTGRES_USER: zentral_user
      POSTGRES_PASSWORD: zentral_dev_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentral_user -d zentral"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"  # web UI
      - "1025:1025"  # SMTP

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql://zentral_user:zentral_dev_2026@db:5432/zentral
      DEBUG: "True"
      SECRET_KEY: django-insecure-local-docker-dev-only
      DJANGO_SETTINGS_MODULE: management_system.settings
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin_dev_2026
      MINIO_BUCKET_NAME: erp-media
      MINIO_USE_SSL: "False"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      DEFAULT_FROM_EMAIL: no-reply@zentral.local
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./management_system:/app/management_system
      - media_files:/app/management_system/media

volumes:
  postgres_data:
  media_files:
  minio_data:
